name: agent-j0-probe

# The daily agent probe against production (umbrella ruling 3): J0 registers
# as a coding agent with no account, creates a Free Blockfrost port on
# preprod and requests it; the prod-safe contract tests run on that same
# registration; the standing test user (e2e@txpipe.io) claims the project in
# the browser; the request is made again; and J0 deletes the claimed
# project, pass or fail. One registration per run, well inside fabric's caps
# of 3 per IP in 24 hours and 200 unclaimed projects live. Nothing is left to
# the expiry sweep unless the run fails before its claim.
#
# - Daily at 18:00 UTC and on workflow_dispatch, with a boolean force_fail
#   that makes the run fail on purpose, alerting IRM on a failure. Only runs
#   of main receive the IRM webhook, so a dispatch on another branch logs that
#   its alert was skipped.
# - On pull requests that change the probe, from this repository only: the
#   same run against production, no alert, so a change is proven before it
#   merges. GitHub dispatches only workflows already on the default branch.
# - It signs in as the test user, so it shares the production-test-user
#   concurrency group with every job that does (J2 at 06:00 UTC, the port
#   suite at 10:00 UTC).
# - When the probe reports nothing, one alert says so, as no result alert
#   would fire: `e2e-agent-j0-setup` when a step before J0 failed (checkout,
#   install or Chromium) or J0 exited without results (a usage error, or a
#   break outside its steps), and `e2e-agent-j0-cancelled` when the job was
#   cancelled (its 20 minutes ran out, a newer run took its place in the
#   concurrency group, or someone cancelled it), which may leave a claimed
#   project on the test user's account.

on:
  pull_request:
    paths:
      - .github/workflows/agent-j0-probe.yml
      - src/agent/**
      - src/cli/agent.ts
      - src/cli/j0.ts
      - src/mock/catalog.ts
      - src/signin.ts
      - src/env.ts
      - src/report.ts
      - package.json
      - pnpm-lock.yaml
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: Fail the run on purpose, to prove the alert path
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    name: Agent J0 against production
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Up to 3 minutes for the port to answer, and a minute for the delete.
    timeout-minutes: 20
    concurrency:
      group: production-test-user
      cancel-in-progress: false
    outputs:
      failed: ${{ steps.failed.outputs.step }}
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: pnpm
        uses: pnpm/action-setup@v4

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      - id: chromium
        name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - id: probe
        name: Run the prod-safe contract tests and J0 against production
        env:
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          IRM_E2E_WEBHOOK_URL: ${{ github.ref == 'refs/heads/main' && secrets.IRM_E2E_WEBHOOK_URL || '' }}
          ALERT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          FORCE_FAIL: ${{ inputs.force_fail == true }}
        # Exit 1 with a result is a failure J0 reported, and alerted with
        # --alert; any other failure reported nothing (2 is a usage error, 3 a
        # break outside the steps).
        run: |
          args=(--env production --contract prod-safe)
          if [[ "$ALERT" == true ]]; then args+=(--alert); fi
          if [[ "$FORCE_FAIL" == true ]]; then args+=(--force-fail); fi
          status=0
          pnpm j0 "${args[@]}" || status=$?
          if [[ $status -eq 0 || ( $status -eq 1 && -f results/j0.json ) ]]; then reported=true; else reported=false; fi
          { echo "status=$status"; echo "reported=$reported"; } >> "$GITHUB_OUTPUT"
          exit "$status"

      # Only when the probe reported nothing: a failed result has posted its
      # own alert, so it names nothing here.
      - id: failed
        name: Name the step that kept the probe from reporting
        if: failure() && steps.probe.outputs.reported != 'true'
        env:
          OUTCOMES: |-
            the checkout failed|${{ steps.checkout.outcome }}
            the pnpm setup failed|${{ steps.pnpm.outcome }}
            the Node setup failed|${{ steps.node.outcome }}
            the install failed|${{ steps.install.outcome }}
            the Chromium install failed|${{ steps.chromium.outcome }}
            J0 exited ${{ steps.probe.outputs.status }} with no result|${{ steps.probe.outputs.reported == 'false' && 'failure' || 'skipped' }}
        run: awk -F'|' '$2 == "failure" { print "step=" $1; exit }' <<<"$OUTCOMES" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-j0-probe-results
          path: results/
          if-no-files-found: ignore

  # As in contracts.yml: posted with curl and jq, needing no checkout or Node,
  # which may be what failed. The webhook URL goes to curl on stdin, never on
  # a command line or in the log. `always()`, so a cancelled probe alerts too.
  setup-alert:
    name: Alert when the probe reported nothing
    needs: probe
    if: always() && (needs.probe.result == 'cancelled' || (needs.probe.result == 'failure' && needs.probe.outputs.failed != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          IRM_E2E_WEBHOOK_URL: ${{ github.ref == 'refs/heads/main' && secrets.IRM_E2E_WEBHOOK_URL || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CANCELLED: ${{ needs.probe.result == 'cancelled' }}
          FAILED: ${{ needs.probe.outputs.failed }}
        run: |
          if [[ "$CANCELLED" == true ]]; then
            uid=agent-j0-cancelled
            title="e2e agent probe cancelled (production)"
            message="The probe was cancelled before it finished: its 20 minutes ran out, a newer run took its place in production-test-user, or someone cancelled it. If it had claimed its project, the project may still be on the test user's account."
          else
            uid=agent-j0-setup
            title="e2e agent probe reported nothing (production)"
            message="$FAILED, so J0 and the agent contract reported nothing against production."
          fi
          if [[ -z "$IRM_E2E_WEBHOOK_URL" ]]; then
            echo "alert skipped for $uid: IRM_E2E_WEBHOOK_URL is not set"
            exit 0
          fi
          jq -n --arg uid "e2e-$uid" --arg title "$title" --arg message "$message" --arg link "$RUN_URL" '{
            alert_uid: $uid,
            title: $title,
            message: $message,
            state: "alerting",
            link_to_upstream_details: $link
          }' > "$RUNNER_TEMP/setup-alert.json"
          if status=$(printf 'url = "%s"\n' "$IRM_E2E_WEBHOOK_URL" | curl -K - -s -o /dev/null -w '%{http_code}' \
                --max-time 15 -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/setup-alert.json"); then
            if [[ "$status" == 2* ]]; then echo "alert sent for $uid"; else echo "alert failed with HTTP $status for $uid"; fi
          else
            echo "alert failed for $uid: curl exited $?"
          fi
