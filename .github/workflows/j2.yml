name: j2

# J2, a person's journey against production: from landing on demeter.run to a
# first successful request, its usage and cost in the Console, and the
# Console's price for the port; then the 401, 429 and legacy-cookie edge
# cases on the same session. Signed in as the standing test user
# (e2e@txpipe.io, decision 0047). Report-only: nothing here is a required
# status.
#
# - Daily at 06:00 UTC and on dispatch: alerting IRM on a failure. Only runs of
#   main hold the webhook, so a dispatch on a branch logs that its alert was
#   skipped. The dispatch takes force_fail, which adds a result that fails on
#   purpose.
# - On pull requests that change a journey: the same, no alert. GitHub
#   dispatches only workflows on the default branch, so this is how a branch
#   runs J2 before it merges.
# - When an alerting run fails before the journey starts (checkout, install or
#   Chromium), one `e2e-j2-setup` alert says so: nothing was walked that day,
#   and no journey alert would fire.
#
# Every job that signs in sets the concurrency group production-test-user, so
# no two runs use the user at once: J2 deletes every project the user owns
# before it starts and after it ends.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: Fail the run on purpose, to prove the alert path
        type: boolean
        default: false
  pull_request:
    paths:
      - journeys/**
      - src/journeys/**
      - src/cli/journey*.ts
      - src/surfaces/console.ts
      - .github/workflows/j2.yml

permissions:
  contents: read

jobs:
  sign-in:
    name: Sign-in proof against production
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-test-user
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Sign in as the test user
        env:
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: pnpm journey sign-in --env production

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sign-in-results
          path: results/
          if-no-files-found: ignore

  j2:
    name: J2 against production
    needs: sign-in
    # The sign-in proof gates J2 on pull requests; elsewhere it is skipped.
    if: always() && (needs.sign-in.result == 'success' || needs.sign-in.result == 'skipped')
    runs-on: ubuntu-latest
    # Up to 3 minutes to a first request, 5 for usage, 75 for the cost, plus
    # the browser steps and the clean-up.
    timeout-minutes: 120
    concurrency:
      group: production-test-user
      cancel-in-progress: false
    outputs:
      failed: ${{ steps.failed.outputs.step }}
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: pnpm
        uses: pnpm/action-setup@v4

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      - id: chromium
        name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - id: j2
        name: Walk J2 against production
        env:
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          IRM_E2E_WEBHOOK_URL: ${{ github.ref == 'refs/heads/main' && secrets.IRM_E2E_WEBHOOK_URL || '' }}
          ALERT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          FORCE_FAIL: ${{ inputs.force_fail == true }}
        run: |
          args=(--env production)
          if [[ "$ALERT" == true ]]; then args+=(--alert); fi
          if [[ "$FORCE_FAIL" == true ]]; then args+=(--force-fail); fi
          pnpm j2 "${args[@]}"

      # Only when the journey never started: a failed journey has posted its
      # own alerts, so it names nothing here.
      - id: failed
        name: Name the failed setup step
        if: failure() && steps.j2.outcome == 'skipped'
        env:
          OUTCOMES: |-
            checkout ${{ steps.checkout.outcome }}
            pnpm setup ${{ steps.pnpm.outcome }}
            Node setup ${{ steps.node.outcome }}
            install ${{ steps.install.outcome }}
            Chromium install ${{ steps.chromium.outcome }}
        run: awk '$NF == "failure" { sub(/ [^ ]+$/, ""); print "step=" $0; exit }' <<<"$OUTCOMES" >> "$GITHUB_OUTPUT"

      # The result files, and the masked screenshot each failed step leaves.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j2-results
          path: results/
          if-no-files-found: ignore

  # A failure before the journey skips it, so no result posts an alert. This
  # posts one, in the shape src/report.ts sends, with curl and jq: it needs no
  # checkout or Node, which may be what failed. The webhook URL goes to curl on
  # stdin, never on a command line or in the log.
  setup-alert:
    name: Alert when setup failed
    needs: j2
    if: >-
      failure()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && needs.j2.outputs.failed != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          IRM_E2E_WEBHOOK_URL: ${{ github.ref == 'refs/heads/main' && secrets.IRM_E2E_WEBHOOK_URL || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ needs.j2.outputs.failed }}
        run: |
          if [[ -z "$IRM_E2E_WEBHOOK_URL" ]]; then
            echo "alert skipped for j2 setup: IRM_E2E_WEBHOOK_URL is not set"
            exit 0
          fi
          jq -n --arg step "$FAILED" --arg link "$RUN_URL" '{
            alert_uid: "e2e-j2-setup",
            title: "e2e j2 setup failed (production)",
            message: "\($step) failed before the journey started, so J2 was not walked.",
            state: "alerting",
            link_to_upstream_details: $link
          }' > "$RUNNER_TEMP/setup-alert.json"
          if status=$(printf 'url = "%s"\n' "$IRM_E2E_WEBHOOK_URL" | curl -K - -s -o /dev/null -w '%{http_code}' \
                --max-time 15 -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/setup-alert.json"); then
            if [[ "$status" == 2* ]]; then echo "alert sent for j2 setup"; else echo "alert failed with HTTP $status for j2 setup"; fi
          else
            echo "alert failed for j2 setup: curl exited $?"
          fi
