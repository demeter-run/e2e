name: j2

# J2, a person's journey against production: from landing on demeter.run to a
# first successful request, its usage and cost in the Console, and the
# Console's price for the port; then the 401, 429 and legacy-cookie edge
# cases on the same session. Signed in as the standing test user
# (e2e@txpipe.io, decision 0047). Report-only: nothing here is a required
# status.
#
# - Daily at 06:00 UTC and on dispatch: alerting IRM on a failure. Only runs of
#   main hold the webhook, so a dispatch on a branch logs that its alert was
#   skipped. The dispatch takes force_fail, which adds a result that fails on
#   purpose.
# - On pull requests from this repository that change what J2 runs (the specs,
#   every file they import, the toolchain and the dependencies; test/ keeps
#   the list whole): the same, no alert. GitHub dispatches only workflows on
#   the default branch, so this is how a branch runs J2 before it merges.
# - When an alerting run reports nothing, one alert says so, as no journey
#   alert would fire: `e2e-j2-cancelled` when the job was cancelled (its
#   timeout ran out, another job of the group took its place, or someone
#   cancelled it), and `e2e-j2-setup` when it failed with no result or was
#   skipped. Its message says whether J2 was walked: not when a set-up step
#   failed, J2 refused its arguments (exit 2, a missing password, say) or its
#   job was skipped (the run was cancelled as it started, before GitHub
#   evaluated J2's job; once J2 waits its turn for the test user, a cancelled
#   run ends it cancelled); maybe partway when J2 broke outside the journey
#   (exit 3); maybe not at all, or partway, when the job failed with no step
#   to name (GitHub could not set it up, or its runner was lost). A walk that may have been cut short may leave a
#   project on the test user's account until a later run deletes it, and the
#   message says so.
#
# Every job that signs in sets the concurrency group production-test-user, so
# no two runs use the user at once: J2 deletes every project the user owns
# before it starts and after it ends. `queue: max` keeps every waiting job, but
# only while every job of the group sets it: by default the group keeps one
# pending job, and a newer one cancels it, so that day goes unwalked. An
# alerting run of J2 says so (`e2e-j2-cancelled`, above), but the port suite's
# alert is a step of the job that was cancelled, so it never posts.
# test/workflows.test.ts fails when a job of the group drops the key, before a
# run is lost. A pull request's newer push replaces its older run instead (the
# workflow's own concurrency below), so superseded pushes do not queue in the
# group behind each other.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: Fail the run on purpose, to prove the alert path
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/j2.yml
      - journeys/**
      - src/journeys/**
      - src/cli/journey*.ts
      - src/checks/check.ts
      - src/checks/intent.ts
      - src/surfaces/**
      - src/env.ts
      - src/html.ts
      - src/http.ts
      - src/report.ts
      - src/secrets.ts
      - playwright.config.ts
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

# Every script runs as test/journeys.test.ts runs it: bash with -e and
# pipefail. Left unset, GitHub runs bash with -e alone, and a failure early in
# a pipeline would go unseen.
defaults:
  run:
    shell: bash

# One run per pull request: a newer push cancels the older run, waiting or
# walking (J2's `if:` below lets it). What it left stays until a later run
# deletes it: the sign-in proof, J2's clean slate and its clean-up each delete
# every project the user owns, when they get to sign in. Every other run is a
# group of its own, so a scheduled or dispatched run is never cancelled here.
concurrency:
  group: j2-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sign-in:
    name: Sign-in proof against production
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-test-user
      cancel-in-progress: false
      # actionlint 1.7.7 does not know this key yet; GitHub does.
      queue: max
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Sign in as the test user
        env:
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: pnpm journey sign-in --env production

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sign-in-results
          path: results/
          if-no-files-found: ignore

  j2:
    name: J2 against production
    needs: sign-in
    # The sign-in proof gates J2 on pull requests; elsewhere it is skipped. A
    # pull request from a fork runs neither. `!cancelled()` lets J2 run after
    # the skipped proof, as `always()` would, but GitHub re-evaluates a
    # running job's `if:` when its run is cancelled, and `always()` would walk
    # on: this lets a newer push stop it.
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (needs.sign-in.result == 'success' || needs.sign-in.result == 'skipped')
    runs-on: ubuntu-latest
    # The worst case, when J2's test times out: about 5 minutes of set-up,
    # J2's 100, its clean-up's 10, then in a new worker the edge cases' 13 and
    # that worker's clean-up's 10.
    timeout-minutes: 150
    concurrency:
      group: production-test-user
      cancel-in-progress: false
      # actionlint 1.7.7 does not know this key yet; GitHub does.
      queue: max
    outputs:
      status: ${{ steps.j2.outputs.status }}
      failed: ${{ steps.failed.outputs.step }}
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: pnpm
        uses: pnpm/action-setup@v4

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      - id: chromium
        name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - id: j2
        name: Walk J2 against production
        env:
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          IRM_E2E_WEBHOOK_URL: ${{ github.ref == 'refs/heads/main' && secrets.IRM_E2E_WEBHOOK_URL || '' }}
          ALERT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          FORCE_FAIL: ${{ inputs.force_fail == true }}
        # 0 and 1 are verdicts J2 reported, and alerted with --alert; 2 is a
        # usage error (a missing password, say) and 3 a break outside the
        # journey, and neither reported anything. The alert below reads it.
        # test/journeys.test.ts runs this script, and the two below.
        run: |
          args=(--env production)
          if [[ "$ALERT" == true ]]; then args+=(--alert); fi
          if [[ "$FORCE_FAIL" == true ]]; then args+=(--force-fail); fi
          status=0
          pnpm j2 "${args[@]}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      # For the alert below: the set-up step that failed, by name. A set-up
      # step that fails skips J2, so none fails once J2 has started.
      - id: failed
        name: Name the set-up step that failed
        if: failure()
        env:
          OUTCOMES: |-
            the checkout failed|${{ steps.checkout.outcome }}
            the pnpm setup failed|${{ steps.pnpm.outcome }}
            the Node setup failed|${{ steps.node.outcome }}
            the install failed|${{ steps.install.outcome }}
            the Chromium install failed|${{ steps.chromium.outcome }}
        run: awk -F'|' '$2 == "failure" { print "step=" $1; exit }' <<<"$OUTCOMES" >> "$GITHUB_OUTPUT"

      # The result files, and the masked screenshot each failed step leaves.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j2-results
          path: results/
          if-no-files-found: ignore

  # J2 that reported nothing posts no alert of its own. This posts one, in the
  # shape src/report.ts sends, with curl and jq: it needs no checkout or Node,
  # which may be what failed. The webhook URL goes to curl on stdin, never on a
  # command line or in the log. `always()`, so a cancelled or skipped J2
  # alerts too. The script decides from J2's result, from its exit status
  # when it has one, and from the set-up step that failed when one did; with
  # none of them (GitHub could not set the job up, or its runner was lost) it
  # says J2 may not have started, or may have stopped partway.
  setup-alert:
    name: Alert when J2 reported nothing
    needs: j2
    if: >-
      always()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && needs.j2.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: alert
        env:
          IRM_E2E_WEBHOOK_URL: ${{ github.ref == 'refs/heads/main' && secrets.IRM_E2E_WEBHOOK_URL || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.j2.result }}
          STATUS: ${{ needs.j2.outputs.status }}
          FAILED: ${{ needs.j2.outputs.failed }}
        run: |
          if [[ "$STATUS" == 0 || "$STATUS" == 1 ]]; then
            echo "J2 reported its results (exit $STATUS); a failed one alerted on its own"
            exit 0
          fi
          left="A project it deployed may still be on the test user's account until a later run deletes it."
          uid=j2-setup
          title="e2e j2 reported nothing (production)"
          if [[ "$RESULT" == cancelled ]]; then
            uid=j2-cancelled
            title="e2e j2 cancelled (production)"
            message="J2 was cancelled before it reported: its timeout ran out, another job of production-test-user took its place, or someone cancelled it. $left"
          elif [[ "$RESULT" == skipped ]]; then
            message="J2's job was skipped, as it is when the run is cancelled as it starts, before GitHub evaluates J2's job, so J2 was not walked."
          elif [[ -n "$FAILED" ]]; then
            message="$FAILED, so J2 was not walked."
          elif [[ "$STATUS" == 2 ]]; then
            message="J2 exited 2 on a usage error (a missing E2E_USER_PASSWORD, say) before it started, so it was not walked."
          elif [[ -n "$STATUS" ]]; then
            message="J2 exited $STATUS with no result: it broke outside the journey, maybe partway through its walk or after it, so none of its results alerted; any it wrote are in the run's artifacts. $left"
          else
            message="J2's job failed with no result and no set-up step to name: GitHub could not set the job up (an action that would not download, say), or its runner was lost. J2 may not have started, or may have stopped partway through its walk. $left"
          fi
          if [[ -z "$IRM_E2E_WEBHOOK_URL" ]]; then
            echo "alert skipped for $uid: IRM_E2E_WEBHOOK_URL is not set"
            exit 0
          fi
          jq -n --arg uid "e2e-$uid" --arg title "$title" --arg message "$message" --arg link "$RUN_URL" '{
            alert_uid: $uid,
            title: $title,
            message: $message,
            state: "alerting",
            link_to_upstream_details: $link
          }' > "$RUNNER_TEMP/setup-alert.json"
          if status=$(printf 'url = "%s"\n' "$IRM_E2E_WEBHOOK_URL" | curl -K - -s -o /dev/null -w '%{http_code}' \
                --max-time 15 -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/setup-alert.json"); then
            if [[ "$status" == 2* ]]; then echo "alert sent for $uid"; else echo "alert failed with HTTP $status for $uid"; fi
          else
            echo "alert failed for $uid: curl exited $?"
          fi
