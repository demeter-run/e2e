name: contracts

# The contract checks (pricing, intent, apex) against the deployed surfaces.
# They read no product repository, and gate no other repository's pull
# requests. Report-only: nothing here is a required status.
#
# - On pull requests and pushes to main: every check against production, no
#   alert.
# - Daily at 05:00 UTC and on dispatch: the same, alerting IRM on a failure.
#   Only runs of main hold the webhook, so a dispatch on a branch logs that
#   its alert was skipped.
#
# Convention for jobs that sign in as the standing test user (e2e@txpipe.io):
# they set
#
#     concurrency:
#       group: production-test-user
#       cancel-in-progress: false
#
# so no two runs use the user at once. No job here signs in; the J2 journey
# and the agent probe are the first that will.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: Fail the run on purpose, to prove the alert path
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run the checks against production
        env:
          IRM_E2E_WEBHOOK_URL: ${{ github.ref == 'refs/heads/main' && secrets.IRM_E2E_WEBHOOK_URL || '' }}
          ALERT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          FORCE_FAIL: ${{ inputs.force_fail == true }}
        run: |
          args=(all --env production)
          if [[ "$ALERT" == true ]]; then args+=(--alert); fi
          if [[ "$FORCE_FAIL" == true ]]; then args+=(--force-fail); fi
          pnpm check "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-results
          path: results/
          if-no-files-found: ignore
